name: snacktag
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  change_app_package_name: ^1.5.0
  cloud_firestore: ^5.6.6
  dio: ^5.4.0
  firebase_analytics: ^11.4.5
  firebase_auth: ^5.5.2
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_storage: ^12.4.5
  flutter:
    sdk: flutter
  flutter_advanced_switch: ^3.1.0
  flutter_lints: ^5.0.0
  flutter_local_notifications: ^19.1.0
  flutter_stripe: ^11.5.0
  get: ^4.7.2
  get_cli: ^1.8.1
  http: ^1.1.0
  image_picker: ^1.1.2
  intl: ^0.18.1
  intl_phone_field: ^3.2.0
  pin_code_fields: ^8.0.1
  pinput: ^5.0.1
  rename_app: ^1.6.2
  roundcheckbox: ^2.0.5
  shared_preferences: ^2.5.3
  sizer: ^3.0.5
  table_calendar: ^3.0.9
  uuid: ^4.5.1
  webview_flutter: ^4.11.0
  webview_flutter_android: ^4.4.2
  webview_flutter_wkwebview: ^3.13.0


dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Metropolis
      fonts:
        - asset: assets/fonts/Metropolis-Regular.otf
          weight: 400
        - asset: assets/fonts/Metropolis-Medium.otf
          weight: 500
        - asset: assets/fonts/Metropolis-Bold.otf
          weight: 700
        - asset: assets/fonts/Metropolis-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Metropolis-Light.otf
          weight: 300
        - asset: assets/fonts/Metropolis-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Metropolis-Thin.otf
          weight: 100
        - asset: assets/fonts/Metropolis-RegularItalic.otf
          weight: 400
          style: italic

    - family: Altoys
      fonts:
        - asset: assets/fonts/altoysitalic.otf
          style: italic

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300


    - family: Europa
      fonts:
        - asset: assets/fonts/Europa-Bold.ttf
          weight: 700
        - asset: assets/fonts/Europa-Light.ttf
          weight: 300




    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100





