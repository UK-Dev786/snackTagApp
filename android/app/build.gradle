plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'  
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.mindept.snacktag"
    compileSdk = 35
    ndkVersion = "26.3.11579264"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.mindept.snacktag"
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        
        // Add these manifest placeholders
        manifestPlaceholders = [
            'appCheckDebugProviderEnabled': 'true',
            'applicationName': 'androidx.multidex.MultiDexApplication'
        ]
    }

    signingConfigs {
        release {
            // keyAlias keystoreProperties['keyAlias']
            // keyPassword keystoreProperties['keyPassword']
            // storeFile file(keystoreProperties['storeFile'])
            // storePassword keystoreProperties['storePassword']
        }
        
        debug {
       
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Disable debug provider in release builds
            manifestPlaceholders = [
                'appCheckDebugProviderEnabled': 'false',
                'applicationName': 'androidx.multidex.MultiDexApplication'
            ]
        }
        
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            
            // Enable debug provider in debug builds
            manifestPlaceholders = [
                'appCheckDebugProviderEnabled': 'true',
                'applicationName': 'androidx.multidex.MultiDexApplication'
            ]
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Core library desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    
    // Base dependencies
    implementation 'androidx.fragment:fragment:1.3.6'
    implementation 'com.google.android.gms:play-services-base:18.2.0'
    
    // Firebase dependencies
    implementation 'com.google.firebase:firebase-analytics:21.5.0'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity:17.1.1'
    implementation 'com.google.firebase:firebase-appcheck-debug:17.1.1'
    
    // Play Integrity API
    implementation 'com.google.android.play:integrity:1.3.0'
    
    // Add this dependency for MultiDexApplication
    implementation 'androidx.multidex:multidex:2.0.1'
}
